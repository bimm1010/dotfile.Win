# Starship configuration

# Dong trong giua cac lenh de thoang mat
add_newline = true

# Dinh dang dong nhac lenh 2 dong gon dep
format = """
$directory$git_branch$git_status$nodejs$python$golang$rust$docker_context$cmd_duration
$character"""

# Thu muc hien tai
[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " 🔒"

# Nhanh Git
[git_branch]
symbol = "🌿 "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Trang thai Git
[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

# Ky hieu go lenh
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Thoi gian chay lenh neu lau hon 2 giay
[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

# NodeJS
[nodejs]
symbol = "⬢ "
style = "bold green"
format = "via [$symbol($version )]($style)"

# Python
[python]
symbol = "🐍 "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

# Golang
[golang]
symbol = "🐹 "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

# Rust
[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol($version )]($style)"

# Docker
[docker_context]
symbol = "🐳 "
style = "bold blue"
format = "via [$symbol$context]($style) "
